<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1804/1804429.png">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <!-- Columna principal: Generador -->
            <div class="col-lg-5">
                <div class="input-group mt-4">
                    <input type="text" id="generated-password" class="form-control" readonly placeholder="Contraseña generada aquí">
                    <button id="generate-btn" class="btn btn-warning"><i class="fa fa-refresh" aria-hidden="true"></i></button>
                </div>
                <div class="input-group mt-4">
                    <button id="copy-btn" class="btn btn-warning" style="font-weight: bold; font-size: 14px; padding-inline: 35px;">COPIAR CONTRASEÑA <i class="fa fa-arrow-right" aria-hidden="true"></i></button>
                </div><br>
                <div class="slider-container mt-4">
                    <label for="password-length">Longitud:</label>
                    <input type="range" id="password-length" min="8" max="32" value="18" class="form-range">
                    <span id="slider-value">18</span>
                </div><br><br>
                <div class="options m-6 text-center">
                    <label><input class="form-check-input warning-checkbox" type="checkbox" id="uppercase" checked> <br>Letras Mayúsculas</label>
                    <label><input class="form-check-input warning-checkbox" type="checkbox" id="lowercase" checked> <br>Letras Minúsculas</label>
                    <label><input class="form-check-input warning-checkbox" type="checkbox" id="numbers" checked> <br>Números</label>
                    <label><input class="form-check-input warning-checkbox" type="checkbox" id="symbols" checked> <br>Símbolos</label>
                </div>
            </div>
            <div class="col-lg-2">
            </div>
            <!-- Columna secundaria: Historial -->
            <div class="col-lg-5">
                <div id="history-container">
                    <h2 class="text-center" id="history-title" style="font-size: 20px; font-weight: bold;">HISTORIAL DE CONTRASEÑAS</h2>
                    <ul id="history-list" class="list-group"></ul>
                    <p id="clear-history" class="text-center text-warning mt-3">Borrar Historial</p>
                </div>
            </div>
        </div>
    </div><br>
    <footer style="font-size: 12px;">© 2024 GC. TODOS LOS DERECHOS RESERVADOS.</footer>
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
